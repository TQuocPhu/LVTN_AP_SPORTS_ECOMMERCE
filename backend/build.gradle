plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.web.ap_sports'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web & REST API
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Realtime WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	
	// Persistence & ORM
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// Redis (Caching, Sessions, Pub/Sub)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// Security & Auth
	implementation 'org.springframework.boot:spring-boot-starter-security'
	
	// Input Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// Spring Mail (Sending activation & contact response emails)
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	// Cloudinary (Cloud Image Storage)
	implementation 'com.cloudinary:cloudinary-http44:1.39.0'
	
	// JJWT (JSON Web Token Access & Refresh Tokens)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	
	// Dev Tools (Hot reload)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// Database Drivers (PostgreSQL & MySQL & H2)
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ──────────────────────────────────────────────────────────────────────
// Load .env file vào JVM system properties cho bootRun
// Cho phép Spring Boot ${KEY:default} resolve được các biến môi trường
// từ file .env local mà không cần set biến môi trường hệ thống thủ công.
// ──────────────────────────────────────────────────────────────────────
bootRun {
	def envFile = file("${projectDir}/.env")
	if (envFile.exists()) {
		def envProps = new Properties()
		envFile.eachLine { line ->
			line = line.trim()
			// Bỏ qua dòng comment và dòng rỗng
			if (!line.startsWith('#') && line.contains('=')) {
				def idx = line.indexOf('=')
				def key = line.substring(0, idx).trim()
				def value = line.substring(idx + 1).trim()
				// Loại bỏ dấu ngoặc kép/đơn bao quanh value nếu có
				if ((value.startsWith('"') && value.endsWith('"')) ||
				    (value.startsWith("'") && value.endsWith("'"))) {
					value = value.substring(1, value.length() - 1)
				}
				envProps[key] = value
			}
		}
		// Inject vào JVM system properties → Spring Boot đọc được qua ${KEY}
		systemProperties(envProps)
		println "✅ [bootRun] Đã load ${envProps.size()} biến từ .env"
	} else {
		println "⚠️  [bootRun] Không tìm thấy file .env tại ${envFile.absolutePath}"
	}
}

